# Gate 1 (docs/PERSONA_PARTNER_PLAN_v2.md, section 10): is the LLM persona partner usable?
# Scripted steady ego with each pilot card played by the LLM partner (and the neutral
# partner: same model, no rules, the competence baseline). 4 cards x 4 seeds x 3 episodes.
# Analyse with: python -m coop.persona_check gate1 outputs/gate1_llm [--twin outputs/gate1_twin]
#
# Server: bash scripts/run_qwen38_days.sh configs/coop/persona_gate1.yaml --out outputs/gate1_llm --workers 48
name: persona_gate1
layout: open2_env
menu: [boiled_egg, boiled_mushroom, boiled_corn_slices, baked_carrot_soup, sliced_eggplant_and_chickpea_stew]
horizon: 300
wrong_delivery_penalty: 20
open_orders: 2
view_radius: 2
days: 1
episodes_per_day: 3
ego_index: 0
personas: [p1, p2, p3, p4, neutral]
run_seeds: [0, 1, 2, 3]
agent: {type: scripted, persona: steady}
conditions:
  steady_ego: {}
reference_agent: null
partner:
  type: llm
  cards: configs/coop/personas/batch1.yaml
  complexity: 6
  remind: true
  enforce: false
  max_tokens: 400
  backend:
    type: openai_compat
    base_url_env: ICRL_PARTNER_BASE_URL       # scripts/run_qwen38_days.sh defaults these to the ego's server
    model_env: ICRL_PARTNER_MODEL
    model: qwen3.8-27b
    api_key_env: ICRL_PARTNER_API_KEY
    chat_template_kwargs_env: COOP_PARTNER_CHAT_TEMPLATE_KWARGS
    params: {temperature: 0.0}
    timeout_s: 120
