# Persona cards, revision 2 (2026-11-17), after Gate 1 and Gate 2 with batch1
# (RESEARCH_STATUS.md, sections 3.16-3.17). Changes from batch1:
#   - dropped handover_spot: the put-down action cannot choose a counter, so neither the
#     LLM partner nor an LLM ego can follow it;
#   - dropped wants_supplies: about one opportunity per 8 episodes with this menu;
#   - "waits for its things" (the user's choice for score as the primary outcome): the
#     partner's habits cost time when ignored, instead of being covered at once:
#       own_station(when_taken=wait): it waits for its station while the other cook uses it
#         (up to coop.rules.OWN_STATION_PATIENCE steps) instead of moving to the other one;
#       split_dish / serves(ego) with patience 40: it covers the steps it leaves to you only
#         after 40 steps (batch1: 20).
# Order, ids and parameters otherwise as batch1. No hand-over category any more (a deviation
# from the plan's "every category in two cards"). "neutral" is built in.

p1:
  backstory: "Ten years in a bakery before this job. Methodical and proud of her oven work; she dislikes being interrupted in the middle of a task."
  rules:
    - own_station: {station: oven0, when_taken: wait}
    - solo_dish: {dish: baked_carrot_soup}
    - order_priority: {which: oldest}
    - on_contention: {mode: insists}
    - on_takeover: {}

p2:
  backstory: "A prep cook who loves knife work and mise en place. Quick at chopping, happy to leave the finishing touches and the pass to someone else."
  rules:
    - split_dish: {dish: sliced_eggplant_and_chickpea_stew, patience: 40}
    - serves: {who: ego, patience: 40}
    - own_station: {station: chopping_board1, when_taken: wait}
    - order_priority: {which: newest}
    - on_contention: {mode: yields}
    - waits_for_commit: {}

p3:
  backstory: "Started as a waiter and moved into the kitchen. Likes to be the one who hands the food over, and has a pot she considers hers."
  rules:
    - serves: {who: self}
    - own_station: {station: pot1, when_taken: wait}
    - on_contention: {mode: yields}
    - waits_for_commit: {}

p4:
  backstory: "A careful cook who watches before acting. Prefers to prepare things properly and let others finish, and keeps to the newest tickets."
  rules:
    - split_dish: {dish: baked_carrot_soup, patience: 40}
    - order_priority: {which: newest}
    - own_station: {station: chopping_board0, when_taken: wait}
    - on_takeover: {}
    - waits_for_commit: {}
