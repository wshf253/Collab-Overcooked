# Rule library v1 for LLM persona partners (docs/PERSONA_PARTNER_PLAN_v2.md, section 4).
#
# Every rule is a tendency with a fallback, never a prohibition. Fields:
#   category   station | dish | order | stage | hand-over | reaction | initiative
#   params     allowed values of each parameter
#   options    optional parameters (first value = default; see coop.rules.OPTIONS)
#   text       second person, for the partner's prompt ("You ...")
#   fallback   when the tendency gives way, second person
#   wants      what the rule asks of the other cook, first person (for the oracle ego and reports)
#   reminder   one line shown to the LLM partner when the rule's opportunity is true now
# The predicates (opportunity / adherent / aligned) are implemented in src/coop/rule_eval.py
# under the same ids; their definitions are in docs/coop-setting.md ("Persona rules").
# Placeholders: {station} {kind} {other} {dish} {group} {group_cells} {which} {other_order}.

own_station:
  category: station
  params: {station: [pot0, pot1, oven0, oven1, chopping_board0, chopping_board1, blender0, blender1]}
  options: {when_taken: [switch, wait]}
  text: "You always use {station} and think of it as yours. You don't like your partner loading it or taking food out of it."
  fallback: "If {station} is busy with your own batch, use {other}."
  wants: "Use {other}; leave {station} to me."
  reminder: "{station} is yours: put your {kind} work there (use {other} only if {station} is busy)."
  text_wait: "You always use {station} and think of it as yours. If your partner has put something in it, you wait until it is free again; you don't move your work to {other}."
  fallback_wait: "If {station} is busy with your own batch, or you have waited {own_patience} steps for your partner's batch, use {other}."
  wants_wait: "Use {other}; leave {station} to me. If you use it, I wait for it."
  reminder_wait: "{station} is yours: put your {kind} work there; if your partner is using it, wait for it."

solo_dish:
  category: dish
  params: {dish: [boiled_egg, boiled_mushroom, boiled_corn_slices, baked_carrot_soup, sliced_eggplant_and_chickpea_stew,
                 boiled_potato, boiled_carrot_slices, boiled_potato_slices, baked_potato_soup, mashed_potato,
                 mashed_potato_and_carrot_mixture, sliced_carrot_and_potato_stew]}
  text: "Whenever there is an order for {dish}, you make it yourself from start to finish: every ingredient, every step, the plating and the delivery. You don't want help with it."
  fallback: "While {dish} has nothing to do (it is cooking), you may help with other orders."
  wants: "Do not add to, plate or serve {dish}; leave it all to me."
  reminder: "There is an order for {dish}: that dish is yours, from start to finish."

split_dish:
  category: dish
  params: {dish: [boiled_egg, boiled_mushroom, boiled_corn_slices, baked_carrot_soup, sliced_eggplant_and_chickpea_stew,
                 boiled_potato, boiled_carrot_slices, boiled_potato_slices, baked_potato_soup, mashed_potato,
                 mashed_potato_and_carrot_mixture, sliced_carrot_and_potato_stew]}
  text: "For {dish} you do the preparation: you get and process the ingredients and load the final utensil. Then you leave it: starting the final utensil, plating and delivering {dish} is your partner's job."
  options: {patience: [20, 40, 60]}
  fallback: "If a loaded {dish} batch or finished {dish} has waited {patience} steps without your partner coming, finish it yourself."
  wants: "Start, plate and serve {dish}; I prepare and load it."
  reminder: "For {dish} you only prepare and load; leave starting the last step, plating and delivering to your partner."

order_priority:
  category: order
  params: {which: [oldest, newest]}
  text: "When you choose a new order to work on, you always take the {which} open order, and you stay with it until it is served."
  fallback: "If the {which} order has nothing you can do right now, help with the other one."
  wants: "Take the {other_order} open order; I take the {which}."
  reminder: "Choose the {which} open order to work on."

serves:
  category: stage
  params: {who: [self, ego]}
  options: {patience: [20, 40, 60]}      # who=ego only: how long food waits before it serves
  text_self: "You like to finish things: you always plate the food and deliver it yourself."
  fallback_self: "If you are busy elsewhere for long, your partner may serve."
  wants_self: "Leave plating and delivering to me."
  reminder_self: "Food is being cooked or is ready: plating and delivering is your job."
  text_ego: "You never plate or deliver: serving is your partner's job. You stay with cooking and preparing."
  fallback_ego: "If finished food has waited {patience} steps without your partner coming, serve it yourself."
  wants_ego: "Do all the plating and delivering; I never serve."
  reminder_ego: "Leave plating and delivering to your partner."

wants_supplies:
  category: stage
  params: {}
  text: "Once you have started loading a utensil, you stay at it until the batch is complete. You expect your partner to bring you the missing raw ingredients and put them on a counter near you."
  fallback: "If nothing has come after 15 steps, fetch the missing ingredient yourself."
  wants: "Bring the missing raw ingredients of my unfinished batch to a counter near me."
  reminder: "Your batch in {station} is incomplete: stay at it and wait for your partner to bring {missing}."

handover_spot:
  category: hand-over
  params: {group: [left, center, right]}
  text: "When you put something down to pass it on, you always use the {group} counters ({group_cells})."
  fallback: "If all {group} counters are full, use the nearest free counter."
  wants: "Put items for me on the {group} counters ({group_cells})."
  reminder: "If you put something down, use the {group} counters ({group_cells})."

on_takeover:
  category: reaction
  params: {}
  text: "If your partner takes over something you started (takes food out of a utensil you loaded, adds to your batch, or picks up an item you put down), you let them have that order and switch to another order."
  fallback: "If there is no other order to work on, carry on."
  wants: "Do not take over my unfinished items."
  reminder: "Your partner took over your {dish}: leave that order to them and switch to the other order."

on_contention:
  category: reaction
  params: {mode: [yields, insists]}
  text_yields: "When you and your partner head for the same station, you step back and do something else."
  fallback_yields: "If they have not used it after 5 steps, go ahead."
  wants_yields: "Take the station when we both go for it; I will give way."
  reminder_yields: "Your partner is heading for {station} too: step back and do something else."
  text_insists: "When you and your partner head for the same station, you carry on: you were there first."
  fallback_insists: "If your partner is already using it, wait or do something else."
  wants_insists: "Give way when we both go for the same station."
  reminder_insists: "Your partner is heading for {station} too: carry on, it is yours."

waits_for_commit:
  category: initiative
  params: {}
  options: {patience: [5, 10]}
  text: "When a new order comes in, you first wait up to {patience} steps to see what your partner starts, and then you take what is left."
  fallback: "After {patience} steps you start anyway."
  wants: "Commit to a new order quickly; don't wait for me."
  reminder: "A new order just came in: wait a few steps to see what your partner starts."

# Context rules (docs/CONTEXT_PARTNER_PLAN_v3.md, section 4): what the partner DOES in a
# context. No fallback: the partner does what its mode says whatever the other cook does (a
# global deadlock guard in the runner is not part of the persona). Every "wants" line is an
# action for the other cook. Contexts are dish-agnostic; {dish} / {kind} / {order} in reminders
# are filled with the current instance.
default_work:
  category: context
  params: {mode: [prep, whole, station]}
  text_prep: "Your job is preparation: you fetch ingredients and cut or blend them for the open orders. You do not cook (pots and ovens) and you do not plate or serve. A raw ingredient that goes straight into a pot or oven you put on a counter for your partner."
  wants_prep: "Cook and serve what I prepare: take my prepared items and the raw ingredients I put on the counters into the pots and ovens, then plate and deliver."
  reminder_prep: "You prepare; cooking, plating and serving are your partner's part."
  text_whole: "You take one order and do it yourself from start to finish: every ingredient, every step, the plating and the delivery. You take the oldest open order your partner is not working on and stay with it until it is served. You do not work on the other order."
  wants_whole: "Take the other open order and do it from start to finish; I do mine."
  reminder_whole: "Stay with your own order ({order}) until it is served."
  # station (plan v4, 2.1): the cooking-station cook; plates, does not serve (open point 12)
  text_station: "You work at the cooking stations: you load the pots and ovens, start them, take the food out and plate it. You do not fetch raw ingredients, you do not cut or blend, and you do not serve: your partner brings you what to cook and serves what you plate."
  wants_station: "Bring me the ingredients, prepared, and serve what I plate: I stay at the pots and ovens."
  reminder_station: "You stay at the pots and ovens: load, cook and plate what is brought to you; you do not fetch, prepare or serve."

on_urgent:
  category: context
  params: {mode: [takes, keeps]}
  options: {unless_ego_on_it: ["no", "yes"]}
  text_takes: "When an order is about to expire (its timer is low), you drop what you are doing and finish that order yourself{unless}."
  wants_takes: "When an order becomes urgent, I take it{unless_wants}; you keep going and prepare the next order."
  reminder_takes: "{dish} is about to expire: drop what you are doing and finish it{unless}."
  text_keeps: "When an order is about to expire, you carry on with your own work; you never switch to the urgent order."
  wants_keeps: "When an order becomes urgent and I am on my own work, take the urgent order yourself."
  reminder_keeps: "{dish} is about to expire: carry on with your own work."

on_blocked:
  category: context
  params: {mode: [clears, waits]}
  text_clears: "When every utensil of a kind you need is busy (running, or holding finished food nobody has taken), you take the finished food out and move it on, plate or serve it, to free a utensil."
  wants_clears: "When all utensils of a kind are full, I clear one; you do other work."
  reminder_clears: "Every {kind} is busy: take the finished food out to free one."
  text_waits: "When every utensil of a kind you need is busy, you do other work that does not need it. You never clear a full utensil."
  wants_waits: "When all utensils of a kind are full, clear one yourself; I won't."
  reminder_waits: "Every {kind} is busy: do other work; do not clear it."

on_prep_ready:
  category: context
  params: {mode: [switches, continues]}
  text_switches: "When prepared items (cut or blended) are waiting for an open order, you switch to cooking and serving them."
  wants_switches: "When prepared items are waiting, I cook and serve them; you keep preparing."
  reminder_switches: "Prepared items for {dish} are waiting: cook and serve them."
  text_continues: "When prepared items are waiting, you keep preparing; cooking them is not your part."
  wants_continues: "When prepared items are waiting, cook and serve them."
  reminder_continues: "Prepared items for {dish} are waiting: keep preparing."

# Counter groups (by position across the kitchen, computed from the layout):
# left = x in the left third, center = middle third, right = right third.
